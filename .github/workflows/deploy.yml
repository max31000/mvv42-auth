# Test → build image → push to GHCR → run on the VDS.
# One-time server prerequisites (NOT automated, see README "Deploy"): database mvv42_auth + user in
# cashpulse-mysql, nginx location /auth/ (mvv42-infra), repo secrets listed below.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-mvv42-auth
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/max31000/mvv42-auth

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet test Mvv42.Auth.sln -c Release

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/Mvv42.Auth/Dockerfile
          push: true
          # Only the immutable sha- tag (no latest): the server runs exactly this tag, so nothing (e.g. watchtower)
          # can swap the container for another image behind CI's back.
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Off until the server side is bootstrapped (DB, secrets). Enable with:
    #   gh variable set AUTH_DEPLOY_ENABLED -b true -R max31000/mvv42-auth
    if: vars.AUTH_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read    # GITHUB_TOKEN used for docker login on the server (works for a private package)
    steps:
      - name: Run container on VDS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          AUTH_DB_CONNECTION_STRING: ${{ secrets.AUTH_DB_CONNECTION_STRING }}
          # Transition only: used while /etc/mvv42/secrets/auth-login-bot-token does not exist on the server.
          AUTH_TELEGRAM_BOT_TOKEN: ${{ secrets.AUTH_TELEGRAM_BOT_TOKEN }}
          AUTH_ADMIN_TELEGRAM_IDS: ${{ secrets.AUTH_ADMIN_TELEGRAM_IDS }}
          IMAGE_REF: ${{ env.IMAGE }}:sha-${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          envs: AUTH_DB_CONNECTION_STRING,AUTH_TELEGRAM_BOT_TOKEN,AUTH_ADMIN_TELEGRAM_IDS,IMAGE_REF,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu

            # Secrets go to a root-only env-file instead of the docker command line (ps / shell history).
            # Path per mvv42-infra docs/conventions.md: /etc/mvv42/env/<container>.env (dir 700, file 600).
            ENV_DIR=/etc/mvv42/env
            ENV_FILE="$ENV_DIR/mvv42-auth.env"
            NETWORK=cashpulse-network
            install -d -m 700 "$ENV_DIR"

            # X-Forwarded-* are trusted only from the gateway of the network the published port maps through
            # (nginx on the host -> docker-proxy -> container).
            GATEWAY="$(docker network inspect "$NETWORK" -f '{{range .IPAM.Config}}{{if .Gateway}}{{.Gateway}} {{end}}{{end}}' | awk '{print $1}')"
            [ -n "$GATEWAY" ] || { echo "cannot determine the gateway of $NETWORK" >&2; exit 1; }

            # The login-bot token is the HMAC key of the Telegram Login Widget: whoever holds it can sign a login
            # payload for any Telegram id. It lives only on the server (written by hand, mode 600) - not in GitHub,
            # not in other apps (mvv42-infra docs/secrets.md, "Telegram bots").
            BOT_TOKEN_FILE=/etc/mvv42/secrets/auth-login-bot-token
            if [ -s "$BOT_TOKEN_FILE" ]; then
              LOGIN_BOT_TOKEN="$(tr -d '[:space:]' < "$BOT_TOKEN_FILE")"
            else
              echo "WARNING: $BOT_TOKEN_FILE is missing - using the AUTH_TELEGRAM_BOT_TOKEN GitHub secret (transition)"
              LOGIN_BOT_TOKEN="${AUTH_TELEGRAM_BOT_TOKEN:-}"
            fi
            [ -n "$LOGIN_BOT_TOKEN" ] || { echo "login bot token is empty - refusing to deploy" >&2; exit 1; }

            umask 077
            {
              printf 'ConnectionStrings__Auth=%s\n' "$AUTH_DB_CONNECTION_STRING"
              printf 'Telegram__BotToken=%s\n' "$LOGIN_BOT_TOKEN"
              printf 'Telegram__BotUsername=%s\n' 'mv_cashpulse_bot'
              printf 'Auth__AdminTelegramIds=%s\n' "$AUTH_ADMIN_TELEGRAM_IDS"
              printf 'Auth__AllowedOrigins=%s\n' 'https://mvv42.ru'
              printf 'Auth__KeysPath=%s\n' '/var/lib/mvv42-auth/keys'
              printf 'Auth__TrustedProxyCidrs=%s\n' "$GATEWAY/32"
            } > "$ENV_FILE.tmp"
            chmod 600 "$ENV_FILE.tmp"
            mv "$ENV_FILE.tmp" "$ENV_FILE"

            # Signing keys persist across deploys; the container runs as uid 1654 ("app" in aspnet:8.0).
            install -d -m 700 -o 1654 -g 1654 /var/lib/mvv42-auth/keys

            # Pull with the job's GITHUB_TOKEN and a throw-away docker config (same as mvv42-infra
            # deploy-dotnet-api.yml): works for a private GHCR package, leaves no stored login behind.
            DOCKER_CONFIG="$(mktemp -d)"; export DOCKER_CONFIG
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin > /dev/null
            docker pull -q "$IMAGE_REF" || { docker logout ghcr.io > /dev/null || true; rm -rf "$DOCKER_CONFIG"; exit 1; }
            docker logout ghcr.io > /dev/null || true
            rm -rf "$DOCKER_CONFIG"; unset DOCKER_CONFIG

            # Image the current container runs: the rollback target (empty on the very first deploy).
            OLD_IMAGE="$(docker inspect -f '{{.Config.Image}}' mvv42-auth 2>/dev/null || true)"
            echo "previous image: ${OLD_IMAGE:-<none>}"

            # Identical arguments for the new and (on rollback) the old image. CI owns this container, watchtower
            # must leave it alone (mvv42-infra round 2 contract).
            run_container() {
              docker run -d \
                --name mvv42-auth \
                --restart unless-stopped \
                --label com.centurylinklabs.watchtower.enable=false \
                --network "$NETWORK" \
                -p 127.0.0.1:5010:8080 \
                -p 127.0.0.1:9510:9091 \
                -v /var/lib/mvv42-auth/keys:/var/lib/mvv42-auth/keys \
                --env-file "$ENV_FILE" \
                "$1"
            }

            wait_healthy() {
              for i in $(seq 1 30); do
                if curl -fsS --max-time 3 http://127.0.0.1:5010/auth/health >/dev/null; then return 0; fi
                sleep 1
              done
              return 1
            }

            docker rm -f mvv42-auth 2>/dev/null || true
            if run_container "$IMAGE_REF" && wait_healthy; then
              echo "mvv42-auth is healthy ($IMAGE_REF)"
              docker image prune -f
              exit 0
            fi

            echo "!! mvv42-auth ($IMAGE_REF) did not become healthy in 30s"
            docker logs --tail 100 mvv42-auth 2>&1 || true
            docker rm -f mvv42-auth 2>/dev/null || true
            if [ -z "$OLD_IMAGE" ]; then
              echo "!! first deploy: nothing to roll back to"
              exit 1
            fi
            echo "!! rolling back to $OLD_IMAGE"
            if run_container "$OLD_IMAGE" && wait_healthy; then
              echo "!! rolled back, previous image is healthy again"
            else
              echo "!! ROLLBACK FAILED, previous image not healthy either - fix by hand"
              docker logs --tail 50 mvv42-auth 2>&1 || true
            fi
            exit 1

  notify:
    needs: [test, image, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${CHAT_ID}" \
            --data-urlencode text="mvv42-auth deploy failed: ${RUN_URL}"
